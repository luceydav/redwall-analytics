[build]
command = "quarto render && cp -r static/post _site/post && cp -r static/rmarkdown-libs _site/rmarkdown-libs && cp -r static/images _site/images && cp -r static/img _site/img"
publish = "_site"

[build.environment]
QUARTO_VERSION = "1.8.27"

[[plugins]]
package = "netlify-plugin-quarto"

[context.branch-deploy]
command = "quarto render && cp -r static/post _site/post && cp -r static/rmarkdown-libs _site/rmarkdown-libs"

[context.deploy-preview]
command = "quarto render && cp -r static/post _site/post && cp -r static/rmarkdown-libs _site/rmarkdown-libs"
